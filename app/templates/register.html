{% extends "base.html" %}

{% block title %}Register — CineBook{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-header">
        <h2>Create an Account</h2>
        <p>Join CineBook to reserve movie tickets easily</p>
    </div>

    <form method="POST" action="{{ url_for('main.register') }}">
        <div class="form-group">
            <label class="form-label" for="name">Full Name</label>
            <input type="text" id="name" name="name" class="form-control" placeholder="e.g. Rahul Sharma" required autofocus>
        </div>

        <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="At least 6 characters" minlength="6" required>
        </div>

        <div class="form-group">
            <label class="form-label" for="confirm_password">Confirm Password</label>
            <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Re-enter your password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 10px;">
            Register Account
        </button>
    </form>

    <div style="text-align: center; margin-top: 24px; font-size: 0.9rem; color: var(--text-muted);">
        Already have an account? <a href="{{ url_for('main.login') }}" style="color: var(--accent); font-weight: 600; text-decoration: none;">Login here</a>
    </div>
</div>
{% endblock %}
